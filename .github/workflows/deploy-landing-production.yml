# Deploys on push to production (changes reach it by PR from staging). workflow_dispatch needs this file on the default branch, so first runs are started by a push.
name: Deploy Landing site (production)

# One deploy per app. A change under apps/landing or packages/ redeploys this app; the other apps have their own workflow.
on:
  push:
    branches: [production]
    paths:
      - "apps/landing/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-landing-production.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Server details are secrets of the GitHub environment "production" (PROD_VPS_HOST, PROD_VPS_USER, PROD_VPS_SSH_KEY), named apart from
    # staging's VPS_* so a missing one can never fall back to the staging box. Build values are fixed here, not read from Actions variables.
    environment: production
    steps:
      - name: Check production secrets
        env:
          HOST: ${{ secrets.PROD_VPS_HOST }}
          USER_NAME: ${{ secrets.PROD_VPS_USER }}
          KEY: ${{ secrets.PROD_VPS_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing PROD_VPS_HOST"
          [ -n "$USER_NAME" ] || missing="$missing PROD_VPS_USER"
          [ -n "$KEY" ] || missing="$missing PROD_VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Production secrets missing in the GitHub environment 'production':$missing. Nothing was built or deployed. Set them, then run this workflow by hand."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: resolving "latest" through GitHub's release API returned 504 on consecutive runs.
          bun-version: "1.4.4"

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Build apps/landing
        working-directory: apps/landing
        run: bun run build
        env:
          DOMAIN_URL: hospio360.com
          NEXT_PUBLIC_HOTEL_APP_URL: https://app.hospio360.com
          # The guest booking page (/stay/<token>) and the partner form read the API.
          NEXT_PUBLIC_API_URL: https://api-prod.hospio360.com
          NEXT_PUBLIC_ADMIN_APP_URL: https://backoffice.hospio360.com
          NEXT_PUBLIC_SITE_URL: https://hospio360.com
          NEXT_PUBLIC_CONTACT_EMAIL: hello@oyeksglobal.com
          NEXT_PUBLIC_SITE_INDEXABLE: "true"

      # The standalone bundle is rooted at the workspace: apps/landing/server.js plus the hoisted node_modules.
      - name: Prepare standalone bundle
        run: |
          out=apps/landing/.next/standalone
          mkdir -p "$out/apps/landing/.next"
          cp -r apps/landing/.next/static "$out/apps/landing/.next/static"
          [ -d apps/landing/public ] && cp -r apps/landing/public "$out/apps/landing/public"
          # The commit this bundle was built from, for Platform → System health ("version deployed").
          echo "${{ github.sha }}" > "$out/.sha"
          tar -czf bundle.tar.gz -C "$out" .

      - name: Copy bundle to server
        env:
          VPS_HOST: ${{ secrets.PROD_VPS_HOST }}
          VPS_USER: ${{ secrets.PROD_VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.PROD_VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          remote() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i failed, retrying in $((i*8))s"; sleep $((i*8)); done; return 1; }
          remote ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 "$VPS_USER@$VPS_HOST" "mkdir -p apps/hospio-landing-production"
          remote scp -i ~/.ssh/deploy_key -o ConnectTimeout=30 bundle.tar.gz "$VPS_USER@$VPS_HOST:apps/hospio-landing-production/bundle.tar.gz"
          rm -f ~/.ssh/deploy_key

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR="$HOME/apps/hospio-landing-production"
            cd "$APP_DIR"

            # The unit is installed once on the server (scripts/vps/bootstrap-production.sh in hospio-backend); the deploy user may only
            # stop, start and restart it, so CI never writes system files.

            if [ -d current ]; then rm -rf previous; mv current previous; fi
            mkdir -p current
            tar -xzf bundle.tar.gz -C current
            rm -f bundle.tar.gz

            sudo systemctl stop hospio-landing-production.service || true
            sleep 1
            sudo fuser -k 3003/tcp 2>/dev/null || true
            sudo systemctl start hospio-landing-production.service
            for i in $(seq 1 20); do
              sleep 2
              if curl -fsS -o /dev/null "http://127.0.0.1:3003/"; then echo "Landing site is up on :3003"; rm -rf previous; exit 0; fi
            done
            echo "Landing site did not answer on :3003 — rolling back"
            journalctl -u hospio-landing-production.service -n 40 --no-pager || true
            if [ -d previous ]; then rm -rf current; mv previous current; sudo systemctl restart hospio-landing-production.service; fi
            exit 1
