<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4c091e">
<title>You're offline · Hospio360</title>
<style>
	:root { color-scheme: light; }
	* { box-sizing: border-box; }
	body {
		margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
		background: #f7f5f5; color: #1f1416;
		font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	}
	main {
		width: 100%; max-width: 420px; background: #fff; border: 1px solid #eadfe2; border-radius: 16px;
		padding: 32px 24px; text-align: center; box-shadow: 0 8px 24px rgba(76, 9, 30, 0.08);
	}
	.mark { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 16px; background: #4c091e; display: flex; align-items: center; justify-content: center; }
	.mark svg { width: 36px; height: 36px; }
	h1 { margin: 0 0 8px; font-size: 20px; }
	p { margin: 0; font-size: 15px; line-height: 1.5; color: #5c4b50; }
	button {
		margin-top: 24px; min-height: 44px; padding: 10px 24px; border: 0; border-radius: 10px;
		background: #4c091e; color: #fff; font: 600 15px/1 inherit; font-family: inherit; cursor: pointer;
	}
	button:disabled { opacity: 0.7; }
	.status { margin-top: 12px; font-size: 13px; color: #8a7a7e; min-height: 1.4em; }
</style>
</head>
<body>
<main>
	<div class="mark" aria-hidden="true">
		<svg viewBox="0 0 20 20" fill="none"><path d="M1.66667 16.6667V13.3333M1.66667 13.3333V10C1.66667 9.55797 1.84226 9.13405 2.15482 8.82149C2.46738 8.50893 2.89131 8.33333 3.33333 8.33333H5M1.66667 13.3333H18.3333M5 8.33333H10M5 8.33333V5.83333C5 5.61232 5.0878 5.40036 5.24408 5.24408C5.40036 5.0878 5.61232 5 5.83333 5H9.16667C9.38768 5 9.59964 5.0878 9.75592 5.24408C9.9122 5.40036 10 5.61232 10 5.83333V8.33333M10 8.33333H16.6667C17.1087 8.33333 17.5326 8.50893 17.8452 8.82149C18.1577 9.13405 18.3333 9.55797 18.3333 10V13.3333M18.3333 13.3333V16.6667" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
	</div>
	<h1>You're offline</h1>
	<p>Hospio360 needs internet to work. We'll reconnect automatically.</p>
	<button type="button" id="retry">Try again</button>
	<div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<script>
	(function () {
		var retry = document.getElementById("retry");
		var status = document.getElementById("status");
		var busy = false;
		// Reload only once the server answers, so the person never sees the browser's own error page.
		function check(manual) {
			if (busy) return;
			busy = true;
			if (manual) { retry.disabled = true; status.textContent = "Checking the connection…"; }
			fetch("/api/version", { cache: "no-store" })
				.then(function (res) {
					if (res.ok) { status.textContent = "Back online. Reconnecting…"; location.reload(); return; }
					throw new Error("not ready");
				})
				.catch(function () {
					if (manual) status.textContent = "Still offline. We'll keep trying.";
				})
				.then(function () { busy = false; retry.disabled = false; });
		}
		retry.addEventListener("click", function () { check(true); });
		window.addEventListener("online", function () { check(false); });
		setInterval(function () { check(false); }, 10000);
	})();
</script>
</body>
</html>
